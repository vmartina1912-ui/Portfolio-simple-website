<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>

    <link rel="stylesheet" href="Style.CSS">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
</head>

<body>
    <div class="Container">
        <div class="section-One">
            <h1 class="section-One__Name">Martina Victor</h1>
            <p class="section-One__Role">Senior HR executive</p>
            <a class="section-One__Contact" href="Index.HTML">Home</a>
        </div>
        <div class="contact-form">
            <form>
                <table>
                    <tr>
                        <td>Name:</td>
                        <td><input type="text" placeholder="Enter your Name" class="contact-form__input"></td>
                    </tr>
                    <tr>
                        <td>Email:</td>
                        <td><input type="text" placeholder="Enter your Email" class="contact-form__input"></td>
                    </tr>
                    <tr>
                        <td>Message:</td>
                        <td><textarea placeholder="Message" class="contact-form__textarea"></textarea></td>
                    </tr>
            
                   <tr>
                       <td><input type="submit" class="contact-form__submit"></td>
                    </tr>
                </table>
            </form>
        </div>
            <div class="section-Five">
            <P class="section-Five__Title">Social Media;
                <a href="https://mail.google.com/mail/u/0/#inbox" target="_blank">Instagram</a>
                <a href="https://www.linkedin.com/notifications/" target="_blank">LinkedIn</a>
            </P>

            <p class="section-Five__desc">&copy;Martina Victor</p>
        </div>

       



    </div>
</body>

</html>
